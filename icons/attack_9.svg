
<svg xmlns='http://www.w3.org/2000/svg'
     width='64' height='64'
     viewBox='0 0 64 64'>

  <!-- FULL BACKGROUND -->
  <rect x='0' y='0' width='64' height='64'
        rx='12'
        fill='#d4af37'/>

  <!-- BIG CROSS AXES (TW STYLE) -->
  <g transform='rotate(45 32 32)'>
    <rect x='26' y='-6' width='12' height='76'
          rx='6'
          fill='#000'/>
    <rect x='8' y='6' width='48' height='18'
          rx='8'
          fill='#000'/>
  </g>

 

  <!-- NUMBER -->
  <text x='32' y='48'
        text-anchor='middle'
        font-size='44'
        font-weight='900'
        fill='#fff'
        stroke='#000'
        stroke-width='6'
        paint-order='stroke'>
    9
  </text>

</svg>