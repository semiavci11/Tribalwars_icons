
<svg xmlns='http://www.w3.org/2000/svg'
     width='64' height='64'
     viewBox='0 0 64 64'>

  <!-- Background -->
  <rect x='1' y='1' width='62' height='62'
        rx='14'
        fill='#c06a1a'
        stroke='#000'
        stroke-width='2'/>

  <!-- AXE 1 -->
  <g transform='rotate(45 32 32) scale(1.15)'>
    <!-- Handle -->
    <rect x='28' y='6' width='8' height='52'
          rx='4'
          fill='rgba(0,0,0,0.9)'/>
    <!-- Blade -->
    <rect x='14' y='6' width='36' height='18'
          rx='6'
          fill='rgba(0,0,0,0.9)'/>
  </g>

  <!-- AXE 2 -->
  <g transform='rotate(-45 32 32) scale(1.15)'>
    <rect x='28' y='6' width='8' height='52'
          rx='4'
          fill='rgba(0,0,0,0.9)'/>
    <rect x='14' y='6' width='36' height='18'
          rx='6'
          fill='rgba(0,0,0,0.9)'/>
  </g>

  <!-- NUMBER -->
  <text x='32' y='48'
        text-anchor='middle'
        font-size='42'
        font-weight='900'
        fill='#fff'
        stroke='#000'
        stroke-width='3'
        paint-order='stroke'>
    6
  </text>

</svg>